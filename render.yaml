services:
  - type: web
    name: yellowhouse-api
    env: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: yellowhouse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: yellowhouse-db
    plan: free
    postgresMajorVersion: 15
