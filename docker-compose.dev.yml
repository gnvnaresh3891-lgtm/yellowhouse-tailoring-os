version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yellowhouse_postgres
    environment:
      POSTGRES_DB: yellowhouse_db
      POSTGRES_USER: yh_admin
      POSTGRES_PASSWORD: yh_password_123
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: yellowhouse_redis
    ports:
      - '6379:6379'

volumes:
  pgdata:
